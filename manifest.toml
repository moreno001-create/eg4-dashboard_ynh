#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "eg4solar"
name = "EG4 Solar"
description.en = "Dashboard for EG4 solar inverters (6000XP): power flow, battery, history, alerts, grid charging"

version = "1.3~ynh1"

maintainers = []

[upstream]
license = "NOASSERTION"
code = "https://github.com/moreno001-create/eg4-dashboard"

[integration]
yunohost = ">= 12.0.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "100M"
ram.build = "200M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/solar"

    [install.init_main_permission]
    help.en = "Anyone in this group can see your solar data and start grid charging. Do not choose visitors."
    type = "group"
    default = "admins"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8766

    [resources.apt]
    packages = "python3, python3-venv, python3-pip"
