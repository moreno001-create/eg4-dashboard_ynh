# Builds the dashboard's Docker image (for Homeport and other Docker hosts) and publishes it as
# ghcr.io/moreno001-create/eg4-dashboard. It runs only in the public copy (eg4-dashboard_ynh), which is what the image is built from.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.repository == 'moreno001-create/eg4-dashboard_ynh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for this machine and check it starts
        run: |
          docker build -t eg4-test .
          docker run -d --name eg4 -p 8766:8766 eg4-test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8766/ -o /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8766/ | grep -qi "<html" || { docker logs eg4; exit 1; }
          docker rm -f eg4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/moreno001-create/eg4-dashboard_ynh
            org.opencontainers.image.description=Self-hosted dashboard for EG4 solar inverters
          tags: |
            ghcr.io/moreno001-create/eg4-dashboard:latest
            ghcr.io/moreno001-create/eg4-dashboard:${{ github.sha }}
